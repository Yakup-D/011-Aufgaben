
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Optimale Bestellanzahl</title>

    <script>
        "use strict";

        function fOptimaleMenge() {

            var vBestellkostenProBestellung;
            var vLagerkostenProDrucker;
            var vJaehrlicheBestellmenge;

            // Fehlende Variablen
            var vOptBestellanzahlProJahr;
            var vBestellmenge;
            var vBestellkosten;
            var vLagerkosten;
            var vGesamtkosten;
            var vNiedrigsteKosten = Infinity;

            vBestellkostenProBestellung = Number(document.getElementById("idBestellkostenProBestellung").value);
            vLagerkostenProDrucker = Number(document.getElementById("idLagerkostenProDrucker").value);
            vJaehrlicheBestellmenge = Number(document.getElementById("idJaehrlicheBestellmenge").value);

            // Optimale Bestellanzahl berechnen
            vOptBestellanzahlProJahr = Math.sqrt(
                vJaehrlicheBestellmenge * vLagerkostenProDrucker / vBestellkostenProBestellung
            );

            var vAusgabeHtml = "";

            vAusgabeHtml = "Die optimale Bestellanzahl liegt bei " + vOptBestellanzahlProJahr.toFixed(2) + " Bestellungen im Jahr.<br><br>";

            vAusgabeHtml = vAusgabeHtml + "<table border=1>";
            vAusgabeHtml = vAusgabeHtml + "<tr><th>Bestellanzahl im Jahr</th><th>Bestellmenge in Stk.</th><th>Bestellkosten in €</th><th>Lagerkosten in €</th><th>Gesamtkosten in €</th></tr>";

            // Niedrigste Gesamtkosten suchen
            for (var i = 1; i <= 12; i++) {

                vBestellmenge = vJaehrlicheBestellmenge / i;
                vBestellkosten = vBestellkostenProBestellung * i;
                vLagerkosten = vLagerkostenProDrucker * vBestellmenge;
                vGesamtkosten = vBestellkosten + vLagerkosten;

                if (vGesamtkosten < vNiedrigsteKosten) {
                    vNiedrigsteKosten = vGesamtkosten;
                }
            }

            // Tabelle erstellen
            
			for (var i = 1; i <= 12; i++) {

vBestellmenge = vJaehrlicheBestellmenge / i;
vBestellkosten = vBestellkostenProBestellung * i;
vLagerkosten = vLagerkostenProDrucker * vBestellmenge;
vGesamtkosten = vBestellkosten + vLagerkosten;

if (vGesamtkosten === vNiedrigsteKosten) {
	vAusgabeHtml = vAusgabeHtml + "<tr style='background-color:lightgrey'>";
} else {
	vAusgabeHtml = vAusgabeHtml + "<tr>";
}

vAusgabeHtml = vAusgabeHtml + "<td>" + i + "</td>";
vAusgabeHtml = vAusgabeHtml + "<td>" + vBestellmenge.toFixed(2) + "</td>";
vAusgabeHtml = vAusgabeHtml + "<td>" + vBestellkosten.toFixed(2) + "</td>";
vAusgabeHtml = vAusgabeHtml + "<td>" + vLagerkosten.toFixed(2) + "</td>";
vAusgabeHtml = vAusgabeHtml + "<td>" + vGesamtkosten.toFixed(2) + "</td>";

vAusgabeHtml = vAusgabeHtml + "</tr>";
}

vAusgabeHtml = vAusgabeHtml + "</table>";

document.getElementById("idAusgabeHtml").innerHTML = vAusgabeHtml;

}

    </script>
</head>

<body>
    <h1>Optimale Bestellanzahl</h1>

    Bestellkosten pro Bestellung:
    <input id="idBestellkostenProBestellung" type="text" value="40"> €<br>

    Durchschnittliche Lagerkosten pro Drucker:
    <input id="idLagerkostenProDrucker" type="text" value="0.30"> €<br>

    Jährliche Bestellmenge:
    <input id="idJaehrlicheBestellmenge" type="text" value="1200"> Drucker<br><br>

    <button onclick="fOptimaleMenge();">Analyse der Gesamtkosten</button><br><br>

    <div id="idAusgabeHtml"></div>

</body>
</html>
